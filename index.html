<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palette Tool · Through Their Eyes</title>
<meta name="description" content="Check a palette or a finished chart for colour-vision deficiency: see it through three kinds of colour vision, find the colour pairs that lose their difference, and get a fix. Everything runs in your browser.">
<!-- 字体自托管，中文走系统栈：Google Fonts 在中国大陆不可达 -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="prism.css?v=5">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>

<header class="masthead">
  <div class="wrap">
    <span class="brand">Through Their Eyes <em>· Palette tool</em></span>
    <a class="back-story" href="https://fatduckzzz.github.io/through-their-eyes/" data-i="story.back"></a>
  </div>
</header>

<main class="wrap" id="ctool">

  <div class="intro">
    <div class="intro-inner">
      <div class="kicker" data-i="ct.kicker"></div>
      <h1 data-i="ct.title"></h1>
      <p class="lede" data-i="ct.lede"></p>
    </div>
  </div>

  <!-- ── 配色表 ───────────────────────────────────────────── -->
  <section class="panel ct-main">
   <div class="ct-cols">
   <div class="ct-left">
    <div class="ct-head">
      <span class="ct-col-lbl ct-true" data-i="ct.true"></span>
      <span class="ct-col-lbl" data-i="ct.protan"></span>
      <span class="ct-col-lbl" data-i="ct.deutan"></span>
      <span class="ct-col-lbl" data-i="ct.tritan"></span>
    </div>
    <div id="ctRows"></div>

    <div class="ct-demo">
      <div class="ct-demo-bar">
        <label class="audit-fix ct-fix"><input type="checkbox" id="ctFix"><span data-i="ct.fix"></span></label>
        <div class="ct-eyes" role="group" aria-label="Type of colour vision shown in the chart">
          <button type="button" class="wchip" data-demo-eye="normal" aria-pressed="true" data-i="ct.eye.normal"></button>
          <button type="button" class="wchip" data-demo-eye="protan" aria-pressed="false" data-i="ct.protan"></button>
          <button type="button" class="wchip" data-demo-eye="deutan" aria-pressed="false" data-i="ct.deutan"></button>
          <button type="button" class="wchip" data-demo-eye="tritan" aria-pressed="false" data-i="ct.tritan"></button>
        </div>
      </div>
      <p class="ct-demo-cap" id="ctDemoCap"></p>
      <svg id="ctDemo" viewBox="0 0 560 190" role="img"></svg>
      <p class="mono-note" data-i="ct.demo.hint"></p>
    </div>
    <div class="ct-actions">
      <button class="btn ghost" id="ctAdd" data-i="ct.add"></button>
      <button class="btn ghost" id="ctReset" data-i="ct.reset"></button>
      <button class="btn ghost" id="ctExport" data-i="ct.export"></button>
    </div>

    <div class="ct-presets">
      <span class="ct-presets-lbl" data-i="ct.presets"></span>
      <button class="ct-preset" data-ref="Okabe–Ito" data-pal="#E69F00,#56B4E9,#009E73,#F0E442,#0072B2,#D55E00,#CC79A7">Okabe–Ito</button>
      <button class="ct-preset" data-ref="Tol" data-pal="#4477AA,#EE6677,#228833,#CCBB44,#66CCEE,#AA3377">Tol bright</button>
      <button class="ct-preset" data-ref="IBM" data-pal="#648FFF,#785EF0,#DC267F,#FE6100,#FFB000">IBM</button>
      <button class="ct-preset" data-pal="#4E79A7,#F28E2B,#E15759,#76B7B2,#59A14F,#EDC948,#B07AA1,#FF9DA7,#9C755F,#BAB0AC">Tableau 10</button>
      <button class="ct-preset" data-pal="#E41A1C,#377EB8,#4DAF4A,#984EA3,#FF7F00,#A65628,#F781BF">ColorBrewer Set1</button>
      <button class="ct-preset" data-pal="#D72D2D,#3CA03C,#3366CC,#F4B400">Red / green</button>
    </div>

    <p class="mono-note" data-i="ct.presets.note"></p>
    <p class="mono-note" data-i="ct.note"></p>
   </div>
   <div class="ct-right">
    <div id="ctCheck" class="ct-check"></div>
   </div>
   </div>
  </section>

  <!-- ── 图片检查 ─────────────────────────────────────────── -->
  <section class="panel ct-img">
    <div class="ct-img-head">
      <div>
        <h2 data-i="an.title"></h2>
        <p class="mono-note" data-i="an.lede"></p>
      </div>
      <label class="btn ct-img-upload">
        <span data-i="ct.img.upload"></span>
        <input type="file" id="ctImgInput" accept="image/*" hidden>
      </label>
    </div>

    <p class="mono-note privacy" data-i="ct.img.note"></p>

    <!-- 分析结果：标注图 + 问题清单 -->
    <div id="ctAnalysis" hidden>
      <div class="an-status" id="anStatus" aria-live="polite"></div>
      <div class="an-layout">
        <figure class="an-figure">
          <canvas id="anCanvas"></canvas>
          <figcaption class="mono-note" data-i="an.figcaption"></figcaption>
        </figure>
        <div class="an-findings" id="anFindings"></div>
      </div>
    </div>

    <!-- 四宫格模拟（原有功能） -->
    <div id="ctImgGrid" class="ct-img-grid" hidden></div>
  </section>

  <footer class="colophon">
    <p data-i="foot.about"></p>
    <p class="mono-note">Part of <a href="https://fatduckzzz.github.io/through-their-eyes/">Through Their Eyes</a>, an interactive data story about colour vision deficiency. <a href="https://fatduckzzz.github.io/through-their-eyes/method.html">How the checker was tested</a>.</p>
    <p class="mono-note">
      <a href="https://davidmathlogic.com/colorblind/" target="_blank" rel="noopener">davidmathlogic.com/colorblind</a> ·
      <a href="https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html" target="_blank" rel="noopener">WCAG 2.2 · 1.4.1 Use of Color</a>
    </p>
  </footer>

</main>

<script src="ambient.js" defer></script>
<script src="i18n.js?v=6"></script>
<script src="cvd.js"></script>
<script src="analyse.js"></script>
<script src="pairs.js?v=2"></script>
<script src="repair.js?v=2"></script>
<script src="ui.js?v=2"></script>
<script src="ctool.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
